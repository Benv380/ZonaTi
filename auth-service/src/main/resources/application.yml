server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # Base de datos propia de este servicio -- no comparte tablas con
    # compra-service. Para hablarle a la base de la VM de Azure, levanta el
    # tunel SSH (ver notas del proyecto) y corre la app con:
    #   $env:DB_URL="jdbc:postgresql://localhost:15432/auth_service_db"
    #   $env:DB_USERNAME="<usuario_pg_vm>"
    #   $env:DB_PASSWORD="<password_pg_vm>"
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # El esquema se controla a mano en schema.sql (ver ese archivo), no
      # con ddl-auto -- mismo patron que compra-service.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: false

jwt:
  # Sin default a proposito -- un secreto "solo para dev" en el repo es un
  # secreto conocido por cualquiera que lea el codigo en GitHub, en dev o
  # en produccion da lo mismo. Sin JWT_SECRET seteado, JwtUtil tira un
  # error claro al arrancar (no arranca en silencio con algo inseguro).
  # Generalo con: openssl rand -base64 64 (minimo 32 bytes/256 bits
  # decodificado). Para dev local sin Docker: exportalo en la terminal
  # antes de levantar (compra-service necesita EXACTAMENTE el mismo
  # valor, ver su application.yml). En Docker Compose ya viaja solo por
  # JWT_SECRET/AUTH_JWT_SECRET (.env, no se commitea).
  secret: ${JWT_SECRET}
  # 1 hora, en milisegundos.
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

chilecompra:
  # Clave AES-256 (32 bytes en base64) para cifrar/descifrar
  # Empresa.chileCompraPasswordCifrada (ver CifradoAesService) -- sin
  # default a proposito, mismo criterio que JWT_SECRET. Generarla con:
  #   openssl rand -base64 32
  # OJO: si esta clave se pierde o cambia, las credenciales ya guardadas
  # quedan indescifrables para siempre -- no hay forma de recuperarlas,
  # cada empresa tendria que volver a cargarlas.
  encryption-key: ${CHILECOMPRA_ENCRYPTION_KEY}
