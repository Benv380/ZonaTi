server:
  port: 8083

spring:
  application:
    name: documento-service
  datasource:
    url: jdbc:postgresql://localhost:5432/documento_service_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
