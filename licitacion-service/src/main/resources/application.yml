server:
  port: 8083

spring:
  application:
    name: licitacion-service
  datasource:
    # Por defecto apunta al Postgres local (puerto 5432). Para hablarle a la
    # base de la VM de Azure, levanta el tunel SSH (ver notas del proyecto)
    # y corre la app con:
    #   $env:DB_URL="jdbc:postgresql://localhost:15432/licitacion_service_db"
    #   $env:DB_USERNAME="<usuario_pg_vm>"
    #   $env:DB_PASSWORD="<password_pg_vm>"
    url: ${DB_URL:jdbc:postgresql://localhost:5432/licitacion_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: false
  task:
    scheduling:
      pool:
        # Por defecto Spring usa UN solo hilo para todos los @Scheduled --
        # con eso, el sync de licitaciones y el de limpieza se turnaban en
        # serie, atrasandose entre si.
        size: 4

licitacion-service:
  cache:
    # Minutos que se considera "fresca" una licitacion cacheada antes de
    # volver a pedir su detalle a Mercado Publico. Tiene que ser MAYOR al
    # intervalo de LicitacionSyncScheduler para que el scheduler no vuelva a
    # pedir el detalle completo de todas las candidatas del dia en cada
    # ciclo (eso generaba picos de CPU y presion sobre la API externa).
    # Aunque venza, el detalle no se re-pide si el listado dice que no
    # cambio (ver licitaciones.horas-max-sin-refrescar).
    ttl-minutos: 60
  # Cuantos dias hacia atras se trae en GET /compra/licitacion/listar (y lo
  # que usa LicitacionSyncScheduler para descubrir candidatas): todo lo
  # publicado en esta ventana, se haya cerrado ya o no. Ojo con subirlo
  # mucho: el primer ciclo pide 1 llamada por dia a la API externa, y
  # despues el detalle de cada candidata nueva (se cachea con
  # cache.ttl-minutos, asi que los ciclos siguientes son livianos).
  dias-listado: 15
  licitaciones:
    # Cuantos detalles de licitacion se piden en paralelo (eran 8 fijos, y
    # la API v1 rechaza peticiones simultaneas del mismo ticket).
    paralelismo-detalle: 2
    # Aunque venza cache.ttl-minutos, el detalle no se vuelve a pedir si el
    # listado dice que no cambio ni el estado ni la fecha de cierre, salvo
    # que la copia cacheada tenga mas de estas horas.
    horas-max-sin-refrescar: 168
  sync:
    # Cuando corre la sincronizacion de adjuntos (cron de Spring: seg min
    # hora dia mes dia-semana), en HORA DE CHILE. Cada hora a los :30 (media
    # hora corrido respecto de Compra Agil en compra-service, para no
    # pegarle a todo al mismo tiempo). Ademas corre una vez al arrancar el
    # servicio (60s despues), asi un deploy no deja esperando hasta la
    # proxima hora. Antes: cada 20 min (fixed-delay) con un "horario
    # nocturno" que, al usar la hora UTC del contenedor, caia de 21:00 a
    # 04:00 en Chile.
    cron: "0 30 * * * *"
    # Interruptor de emergencia: en "false" frena TODA sincronizacion en
    # vivo contra Mercado Publico sin tocar codigo. Default true.
    habilitado: true

jwt:
  # TIENE que ser exactamente el mismo secreto que usa auth-service (ver su
  # application.yml/JWT_SECRET) -- si no coinciden, ningun token valida y
  # todo el servicio queda inaccesible (SecurityConfig exige "authenticated()"
  # en cualquier endpoint). Sin default en el codigo a proposito -- un
  # secreto "solo para dev" commiteado en GitHub es un secreto conocido
  # por cualquiera, no protege nada. Sin JWT_SECRET seteado, JwtUtil tira
  # un error claro al arrancar en vez de fallar silencioso con firmas que
  # nunca calzan.
  secret: ${JWT_SECRET}

auth-service:
  # Donde vive auth-service -- lo usa PerfilClient para pedir el perfil de
  # busqueda de la empresa (rubro/palabras clave/region, ver
  # LicitacionService.buscarConFiltroEmpresa). En Docker Compose se
  # resuelve solo por DNS interno ("auth-service", nombre del servicio);
  # este default es para levantar licitacion-service suelto en dev local.
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

internal:
  # Mismo secreto que internal.service-key en auth-service (ver ese
  # application.yml) -- TIENE que coincidir EXACTO en los 3 servicios,
  # igual que JWT_SECRET. Lo usa AsignacionInternoClient (LimpiezaScheduler)
  # para autenticarse sin un JWT de usuario.
  service-key: ${INTERNAL_SERVICE_KEY}

scraper-service:
  # Donde vive scraper-service (Python + Playwright) -- lo usa
  # LicitacionAttachmentScraperClient para pedir los adjuntos de una
  # licitacion por HTTP en vez de correr el scraping en este proceso. En
  # Docker Compose se resuelve por DNS interno; este default es para
  # levantar licitacion-service suelto en dev local (con scraper-service
  # corriendo aparte, ver scraper-service/app.py).
  url: ${SCRAPER_SERVICE_URL:http://localhost:8090}
  timeout-seconds: 120

mercado-publico:
  # Ticket sale del entorno (.env de la maquina, ver docker-compose.yml),
  # igual que JWT_SECRET -- antes estaba escrito aca, versionado en git.
  # Sin default a proposito: si falta, el servicio no arranca (ver
  # LicitacionClient) en vez de llamar a la API con un ticket vacio.
  licitacion:
    url: https://api.mercadopublico.cl/servicios/v1/publico
    ticket: ${MERCADO_PUBLICO_TICKET:}

logging:
  level:
    cl.zona_ti.licitacion_service.Scheduler: DEBUG
