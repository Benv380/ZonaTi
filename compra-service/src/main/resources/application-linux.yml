# Config SOLO para cuando compra-service corre en la VM de Azure (Linux,
# sin escritorio/GUI). Se activa agregando el perfil "linux" al arrancar la
# app (ver Dockerfile: ENV SPRING_PROFILES_ACTIVE=linux) -- no reemplaza a
# application.yml, solo pisa este valor puntual.
#
# Requisitos previos si se corre sin Docker (una sola vez):
#   sudo apt install -y xvfb python3 python3-pip
#   pip3 install -r compra-service/scripts/requirements.txt
#   playwright install --with-deps chromium

compra-service:
  python:
    # Antepone xvfb-run (pantalla virtual) antes de python3, porque en esta
    # VM no hay escritorio real donde Chromium pueda dibujarse.
    command-prefix: "xvfb-run,-a,--server-args=-screen 0 1920x1080x24,python3"
