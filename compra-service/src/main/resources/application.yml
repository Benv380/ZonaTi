server:
  port: 8082

spring:
  application:
    name: compra-service
  datasource:
    # Por defecto apunta al Postgres local (puerto 5432). Para hablarle a la
    # base de la VM de Azure, levanta el tunel SSH en el puerto 15432 (ver
    # notas en el proyecto) y corre la app con:
    #   $env:DB_URL="jdbc:postgresql://localhost:15432/compra_service_db"
    #   $env:DB_USERNAME="<usuario_pg_vm>"
    #   $env:DB_PASSWORD="<password_pg_vm>"
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compra_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    # Apagado -- el scheduler sincroniza 15 compras (detalle + adjuntos)
    # cada 10 minutos, y con esto en true cada ciclo imprimia una cantidad
    # enorme de SQL al log, sin aportar nada util fuera de debug puntual.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: false

compra-service:
  cache:
    # Minutos que se considera "fresca" una fila cacheada (compras agiles,
    # adjuntos de compra agil) antes de volver a pedirla a Mercado Publico.
    # Tiene que ser MAYOR al intervalo de CompraAgilSyncScheduler
    # (compra-service.sync.fixed-delay, 10 min por defecto) -- con 10
    # (igual al intervalo) el detalle quedaba "vencido" justo antes de
    # cada ciclo, asi que abrir el detalle desde "Mostrar todo" terminaba
    # pegandole en vivo a Mercado Publico (hasta 20s de espera) en vez de
    # servir el cache que todavia era valido.
    ttl-minutos: 20
  sync:
    # Cada cuanto corre CompraAgilSyncScheduler (formato ISO-8601 Duration).
    fixed-delay: PT10M
  python:
    # Comando que lanza scripts/obtener_token_reclamos.py (Playwright),
    # separado por comas -- cada elemento es un argv, en orden, ANTES del
    # script. Default (dev en Windows con escritorio real): "python". Para
    # una VM Linux sin escritorio, ver application-linux.yml (antepone
    # xvfb-run).
    command-prefix: python
    reclamos-script-path: scripts/obtener_token_reclamos.py
    timeout-seconds: 90
  reclamos:
    # Cada cuanto se corre obtener_token_reclamos.py para renovar el token
    # de comprador-api-pro.mercadopublico.cl (ver ReclamosTokenScheduler) --
    # tiene que ser MENOR a token-vida-horas de abajo para renovarlo antes
    # de que venza.
    token-refresh-delay: PT6H
    # Vencimiento real observado a mano: ~8hs. Se cachea con margen (7hs)
    # para no quedar sirviendo un token ya vencido entre un ciclo del
    # scheduler y el siguiente (ver ReclamosTokenCacheService).
    token-vida-horas: 7

jwt:
  # TIENE que ser exactamente el mismo secreto que usa auth-service (ver su
  # application.yml/JWT_SECRET) -- si no coinciden, ningun token valida y
  # todo el servicio queda inaccesible (SecurityConfig exige "authenticated()"
  # en cualquier endpoint). Sin default en el codigo a proposito -- un
  # secreto "solo para dev" commiteado en GitHub es un secreto conocido
  # por cualquiera, no protege nada. Sin JWT_SECRET seteado, JwtUtil tira
  # un error claro al arrancar en vez de fallar silencioso con firmas que
  # nunca calzan.
  secret: ${JWT_SECRET}

auth-service:
  # Donde vive auth-service -- lo usa PerfilClient para pedir el perfil de
  # busqueda de la empresa (rubro/palabras clave/region, ver
  # LicitacionService.buscarConFiltroEmpresa/CompraAgilService.buscar). En
  # Docker Compose se resuelve solo por DNS interno ("auth-service",
  # nombre del servicio); este default es para levantar compra-service
  # suelto en dev local.
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

mercado-publico:
  compra-agil:
    url: https://api2.mercadopublico.cl
    ticket: A84949FD-A50D-40C4-A3D2-83791DFA28A3
  adjuntos:
    url: https://adjunto.mercadopublico.cl/adjunto-compra-agil
    user-key: 41186b85826e80d1a0d445a6ce67d1a3
  auth:
    url: https://servicios-prd.mercadopublico.cl
  comprador:
    # API interna (no documentada/no oficial) de la ficha publica de
    # comprador de Mercado Publico -- unico lugar donde encontramos datos
    # reales de reclamos por organismo (agregado por tipo, ver
    # PerfilCompradorResponse). Exige un JWT anonimo (rol "publico", no una
    # cuenta personal) que expira cada ~8hs -- ese servidor de auth es
    # DISTINTO al de mercado-publico.auth de arriba (el JWT de uno no sirve
    # para el otro), asi que no se puede renovar con el mismo mecanismo
    # liviano (TokenCacheService/AuthClient). Se renueva solo con un
    # scraper Playwright (ver ReclamosTokenScheduler/ReclamosTokenCacheService/
    # scripts/obtener_token_reclamos.py) que replica lo que ya hace la
    # propia pagina publica de la ficha de un comprador al cargar -- no
    # hace falta login con cuenta real.
    #
    # Si el scheduler todavia no corrio (recien arrancó el servicio) o el
    # scraper falla, ReclamosClient.estaDisponible() da false y no se
    # llama nada (fail closed, ver CompraAgilService.reclamosDe) -- el
    # resto del panel sigue funcionando.
    url: https://comprador-api-pro.mercadopublico.cl/comprador
    # RUT de cualquier organismo publico -- solo se usa para cargar la
    # ficha y que la pagina misma pida su token (no hace falta que tenga
    # reclamos). Sin este valor, ReclamosTokenScheduler no renueva nada.
    rut-referencia: ${MERCADO_PUBLICO_RUT_REFERENCIA:}
logging:
  level:
    cl.zona_ti.compra_service.Scheduler: DEBUG
